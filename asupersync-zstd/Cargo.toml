[package]
name = "asupersync-zstd"
version = "0.6.0"
edition = "2024"
license = "LicenseRef-MIT-OpenAI-Anthropic-Rider"
description = "Memory-safe Zstandard (RFC 8878) codec for asupersync: no unsafe code, explicit decode limits."
repository = "https://github.com/Dicklesworthstone/asupersync"
keywords = ["zstd", "zstandard", "compression", "rfc8878"]

[dependencies]

# libzstd as a dev-only differential oracle (owner decision 2026-10-13,
# br-asupersync-t1fblr.11). Never a normal dependency.
[dev-dependencies]
zstd = { version = "0.14", default-features = false }

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_panics_doc = "allow"
missing_errors_doc = "allow"
missing_const_for_fn = "allow"
doc_markdown = "allow"
# The frame and sequence decoders follow RFC 8878's structure in one pass each,
# as the root crate does (it also allows too_many_lines).
too_many_lines = "allow"
cognitive_complexity = "allow"
