[package]
name = "asupersync-downstream-consumer-proof"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[features]
default = []
metrics-profile = ["asupersync/metrics"]
channel-mpsc-select-e2e-profile = ["asupersync/channel-mpsc-select-e2e"]
kafka = ["asupersync/kafka"]

[dependencies]
asupersync = { path = "../../.." }
asupersync_v044 = { package = "asupersync", version = "=0.4.4", default-features = false }

[[bin]]
name = "v044_cancel_compat_consumer"
path = "src/bin/v044_cancel_compat_consumer.rs"

[[test]]
name = "kafka_default_feature_surface"
path = "../../kafka_producer_idempotence_audit.rs"
