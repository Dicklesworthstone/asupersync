[package]
name = "asupersync-sqlite-parity-consumer"
version = "0.0.0"
edition = "2024"
publish = false

# This is a neutral downstream consumer, not an asupersync workspace member.
# Its independent resolve is the cycle boundary required by DEP-ADR-010.
[workspace]
resolver = "3"

[dependencies]
asupersync = { path = "../../..", features = ["sqlite"] }
asupersync-compat = { package = "asupersync", version = "=0.3.10", default-features = false }
fsqlite = { git = "https://github.com/Dicklesworthstone/frankensqlite.git", rev = "92f9e9833f859ebcbe27e9fef16d9cad4372bbd7", default-features = false, features = ["native", "async-api"] }
fsqlite-types = { git = "https://github.com/Dicklesworthstone/frankensqlite.git", rev = "92f9e9833f859ebcbe27e9fef16d9cad4372bbd7", default-features = false, features = ["native"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
