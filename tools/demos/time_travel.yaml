# Time-travel demo parameter reference (not a typed FrankenLab Scenario).
#
# This adjacent YAML records the intended demo parameters for human review.
# No current source literal, discovery route, or Make target loads it.
# `examples/demo_benchmark.rs` keeps its operational parameters as compiled
# constants and reads `artifacts/demo_golden_checksums.json`; it does not read
# this file. Generic CLI path loaders expect the typed Scenario schema, which
# this document intentionally does not implement.
#
# Run:
#   make demo-benchmark
#
# Update golden checksums:
#   GOLDEN_UPDATE=1 make demo-benchmark

schema_version: 1
name: time_travel_demo
description: >
  Reproducible benchmark for the time-travel bug reproduction pipeline.
  Sweeps seeds to find a cancel/obligation race condition, records the
  failing trace, minimizes via hierarchical delta debugging, and
  validates that all artifacts match golden checksums.

# Seed search parameters.
seed:
  start: 0
  count: 50000

# Scenario construction parameters (must match the demo examples).
scenario:
  num_tasks: 8
  obligation_kinds: [SendPermit, Ack, Lease, IoOp]
  late_probability_denominator: 10000  # 1 in 10,000 per obligation
  cancel_target_assignment: "i % 3 != 0"

# Expected results (deterministic for the given seed range).
expected:
  failing_seed: 509
  original_element_count: 30
  minimized_element_count: 3
  is_1_minimal: true

# Artifact checksums are stored in artifacts/demo_golden_checksums.json and are
# read by the benchmark harness. This reference file is not an input to that
# checksum validation.
