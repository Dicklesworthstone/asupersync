# RCH project config — worker routing.
# asupersync's cargo target "pool" grows very large (~120G observed), which can
# fill and wedge a small-disk worker's root filesystem. Monolithic lib-test
# compilation also needs substantial memory; a SQLite test build was killed
# on vmi1264463 before test execution. Prefer the 251 GiB hz3/hz4 workers, whose
# memory and disk headroom were checked when selecting this routing.
# The daemon selects ONLY these workers when any is
# eligible, and falls back to all eligible workers only if none are.
# (Merged with the RCH_WORKER env var if set.)
[routing]
preferred_workers = ["hz3", "hz4"]
