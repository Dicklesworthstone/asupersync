name: Deploy Demo to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'asupersync_web_demo.html'
      - 'packages/browser-core/**'
      - 'assets/og-share-image.png'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Prepare Pages artifact
        run: |
          mkdir -p _site/packages/browser-core
          cp asupersync_web_demo.html _site/index.html
          cp asupersync_web_demo.html _site/asupersync_web_demo.html
          cp packages/browser-core/asupersync.js _site/packages/browser-core/
          cp packages/browser-core/asupersync_bg.wasm _site/packages/browser-core/
          cp packages/browser-core/index.js _site/packages/browser-core/
          mkdir -p _site/assets
          cp assets/og-share-image.png _site/assets/

      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
