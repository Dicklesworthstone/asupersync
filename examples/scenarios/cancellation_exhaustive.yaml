# FrankenLab Scenario: All-point cancellation campaign
# Run with: frankenlab cancel examples/scenarios/cancellation_exhaustive.yaml
schema_version: 1
id: cancellation-exhaustive
description: >
  Record a real sender/receiver baseline, then request cooperative
  cancellation at each recorded scheduler poll opportunity in a fresh run.
  The sender yields while holding a reserve permit, exercising obligation
  cleanup as well as peer drain. Campaign limits report incomplete coverage;
  these boundaries do not enumerate every source-level await expression.

lab:
  seed: 42
  worker_count: 1
  trace_capacity: 4096
  max_steps: 50000
  panic_on_obligation_leak: true

chaos:
  preset: "off"

network:
  preset: ideal

participants:
  - name: sender
    role: sender
    properties:
      messages: 3
  - name: receiver
    role: receiver
    properties:
      capacity: 1

cancellation:
  strategy: all_points

oracles:
  - obligation_leak
  - loser_drain
  - quiescence
  - cancellation_protocol
