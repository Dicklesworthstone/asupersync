# FrankenLab Scenario: Host crash and restart
# Exercises real managed worker replacement after a simulated host crash.
schema_version: 1
id: host-crash-restart
description: >
  Crash host worker-b at T=150ms, restart at T=400ms.
  Both workers need 500ms of active work. Worker-b loses its first
  generation at 150ms, waits offline until 400ms, then completes its
  replacement at 900ms. Verifies managed supervision and quiescence;
  this is not OS process or persistent-state recovery.

lab:
  seed: 8675309
  worker_count: 3
  trace_capacity: 16384
  max_steps: 300000
  panic_on_obligation_leak: true

chaos:
  preset: "off"

network:
  preset: local

faults:
  - at_ms: 150
    action: host_crash
    args:
      host: "worker-b"
  - at_ms: 400
    action: host_restart
    args:
      host: "worker-b"

participants:
  - name: supervisor
    role: supervisor
  - name: worker-a
    role: worker
    properties:
      fail_times: 0
      lifecycle: { work_ms: 500 }
  - name: worker-b
    role: worker
    properties:
      fail_times: 0
      lifecycle: { work_ms: 500 }

oracles:
  - obligation_leak
  - quiescence
  - supervision
  - task_leak
  - actor_leak
